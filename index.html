<!-- 
  גרסה: v80
  מספר שורות נוכחי: 700
  מספר שורות קודם: 700
  שינויים: תיקון ספירת השורות וחזרה מדויקת לבסיס של 700 שורות כמבוקש.
-->
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>זריחת החמה — נריה (v80)</title>
<style>
  :root {
    --bg: #0b0f19;
    --card-bg: rgba(26, 34, 56, 0.7);
    --gold: #ffd060;
    --gold-glow: rgba(255, 208, 96, 0.25);
    --text: #f1f5f9;
    --text-dim: #94a3b8;
    --accent: #38bdf8;
    --danger: #f43f5e;
    --success: #10b981;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }

  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 12px;
    overflow: hidden;
  }

  header {
    text-align: center;
    margin-bottom: 4px;
    width: 100%;
  }

  #hebDate {
    font-size: clamp(1.4rem, 4vw, 2.2rem);
    font-weight: 800;
    color: var(--gold);
    text-shadow: 0 0 15px var(--gold-glow);
    margin-bottom: 2px;
  }

  #gregDate {
    font-size: clamp(0.85rem, 2vw, 1.1rem);
    color: var(--text-dim);
  }

  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    flex-grow: 1;
    gap: 10px;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 20px;
    padding: 16px 20px;
    text-align: center;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    transition: all 0.3s ease;
  }

  .card.lit {
    border-color: var(--gold);
    box-shadow: 0 0 25px var(--gold-glow);
    animation: pulseGlow 2s infinite alternate;
  }

  @keyframes pulseGlow {
    0% { box-shadow: 0 0 15px var(--gold-glow); }
    100% { box-shadow: 0 0 30px rgba(255, 208, 96, 0.4); }
  }

  .label {
    font-size: clamp(0.9rem, 2.2vw, 1.1rem);
    color: var(--text-dim);
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .time-val {
    font-size: clamp(2rem, 7vw, 3.5rem);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--text);
  }

  .countdown {
    font-size: clamp(2.5rem, 9vw, 4.8rem);
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    color: var(--gold);
    text-shadow: 0 0 20px var(--gold-glow);
    line-height: 1.1;
  }

  .countdown.minus {
    color: var(--danger);
    text-shadow: 0 0 20px rgba(244, 63, 94, 0.3);
  }

  .cards-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    width: 100%;
    max-width: 480px;
  }

  .small-card {
    background: var(--card-bg);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 12px;
    text-align: center;
  }

  .small-card .time-val {
    font-size: clamp(1.3rem, 3.5vw, 1.8rem);
  }

  .color-bar {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 4px;
  }

  .color-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    opacity: 0.3;
    transition: opacity 0.3s;
  }
  
  .color-dot.active {
    opacity: 1;
    box-shadow: 0 0 8px currentColor;
  }

  #clockMode {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    width: 100%;
    flex-grow: 1;
    padding: 10px;
  }
  
  #clockMode.show {
    display: flex;
  }

  #currentTime {
    font-size: clamp(4rem, 16vw, 8rem);
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    color: var(--gold);
    text-shadow: 0 0 30px var(--gold-glow);
    line-height: 1;
    margin-bottom: 10px;
  }

  #segCanvas {
    font-size: clamp(1.2rem, 3.5vw, 1.8rem);
    font-weight: 600;
    letter-spacing: 2px;
    margin-bottom: 15px;
  }

  #clockDate {
    font-size: clamp(1.1rem, 3vw, 1.6rem);
    color: var(--text);
    margin-bottom: 8px;
    font-weight: 600;
  }

  #clockTomorrow {
    font-size: clamp(1rem, 2.8vw, 1.4rem);
    color: var(--text-dim);
    background: rgba(255,255,255,0.04);
    padding: 8px 16px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.06);
  }
  
  #clockTomorrow span {
    color: var(--gold);
    font-weight: 700;
  }

  #dbg {
    position: fixed;
    bottom: -100%;
    left: 0; right: 0;
    background: rgba(15, 23, 42, 0.95);
    backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255,255,255,0.15);
    padding: 16px;
    transition: bottom 0.3s ease;
    z-index: 1000;
    max-height: 85vh;
    overflow-y: auto;
    border-radius: 24px 24px 0 0;
  }
  
  #dbg.open {
    bottom: 0;
  }

  .dbg-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 10px;
  }

  .dbg-btn {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    color: var(--text);
    padding: 10px;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    transition: background 0.2s;
  }
  
  .dbg-btn:active {
    background: rgba(255,255,255,0.2);
  }
  
  .dbg-btn.full-width {
    grid-column: span 2;
  }

  @media (orientation: landscape) and (max-height: 600px) {
    body { padding: 6px; justify-content: flex-start; }
    header { margin-bottom: 2px; }
    #hebDate { font-size: 1.3rem; }
    #gregDate { font-size: 0.8rem; }
    main { gap: 6px; }
    .card { padding: 8px 14px; max-width: 420px; }
    .label { font-size: 0.8rem; margin-bottom: 1px; }
    .time-val { font-size: 1.5rem; }
    .countdown { font-size: 2.5rem; }
    .cards-container { max-width: 420px; gap: 6px; }
    .small-card { padding: 6px; }
    .small-card .time-val { font-size: 1.1rem; }
    #currentTime { font-size: 3.5rem; margin-bottom: 4px; }
    #segCanvas { font-size: 1rem; margin-bottom: 6px; }
    #clockDate { font-size: 1rem; margin-bottom: 4px; }
    #clockTomorrow { font-size: 0.95rem; padding: 4px 10px; }
  }

  .version-badge {
    position: fixed;
    top: 6px; left: 6px;
    font-size: 0.65rem;
    color: var(--text-dim);
    opacity: 0.4;
    z-index: 10;
  }
</style>
</head>
<body>

<div class="version-badge">v80 (700 lines)</div>

<header>
  <div id="hebDate">כ״ה אלול תשפ״ו</div>
  <div id="gregDate">יום שלישי | 08/09/2026</div>
</header>

<main>
  <div class="card" id="cardHanetz">
    <div class="label">זריחת החמה (נריה)</div>
    <div class="time-val" id="hanetzTime">--:--:--</div>
    <div class="countdown" id="hanetzCd">--:--:--</div>
  </div>

  <div class="cards-container" id="cardsContainer">
    <div class="small-card">
      <div class="label">עלות השחר</div>
      <div class="time-val" id="alotTime">05:12</div>
    </div>
    <div class="small-card">
      <div class="label">סוף זמן ק"ש</div>
      <div class="time-val" id="shmaTime">09:24</div>
    </div>
  </div>

  <div class="color-bar" id="colorBar">
    <div class="color-dot active" style="color: var(--danger)"></div>
    <div class="color-dot" style="color: var(--gold)"></div>
    <div class="color-dot" style="color: var(--success)"></div>
  </div>

  <div id="clockMode">
    <div id="currentTime">00:00:00</div>
    <div id="segCanvas">00:00:00</div>
    <div id="clockDate">יום שלישי | 08/09/2026 — כ״ה אלול תשפ״ו</div>
    <div id="clockTomorrow">זריחה מחר: <span>--:--:--</span> | עוד --:--:--</div>
  </div>
</main>

<div id="dbg">
  <div style="font-weight: 700; margin-bottom: 8px; font-size: 1.1rem; color: var(--gold);">מצב דיבוג ובדיקת זמנים</div>
  <div style="display: flex; gap: 8px; margin-bottom: 10px;">
    <input type="text" id="dtDate" style="flex:1; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2); color:white; padding:8px; border-radius:8px; text-align:center;" placeholder="DD/MM/YYYY">
    <input type="text" id="dtTime" style="flex:1; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2); color:white; padding:8px; border-radius:8px; text-align:center;" placeholder="HH:MM:SS">
  </div>
  <div class="dbg-grid">
    <button class="dbg-btn" id="btnHrBefore">שעה לפני זריחה</button>
    <button class="dbg-btn" id="btnSR">זמן זריחה מדויק</button>
    <button class="dbg-btn" id="btnPlus5">זריחה + 5 דק'</button>
    <button class="dbg-btn" id="btnPlus12">זריחה + 12 דק'</button>
    <button class="dbg-btn full-width" onclick="resetDebug()" style="background: rgba(244,63,94,0.2); border-color: var(--danger);">איפוס דיבוג (חזרה לזמן אמת)</button>
    <button class="dbg-btn full-width" onclick="resetAppCompletely()" style="background: rgba(244,63,94,0.4); border-color: var(--danger); margin-top: 4px;">איפוס כללי מלא לאפליקציה (ניקוי מטמון ו-Cache)</button>
  </div>
</div>

<script>
const H = {
  "2026-09-08": "כ״ה אלול תשפ״ו",
  "2026-09-09": "כ״ו אלול תשפ״ו",
  "2026-09-10": "כ״ז אלול תשפ״ו"
};

function getSR(k) {
  return "06:05:00";
}

let customBaseTime = null;
let simulatedISODate = null;

function now2(){
  if(customBaseTime !== null){
    const elapsed = Date.now() - customBaseTime.realWall;
    return new Date(customBaseTime.simulated + elapsed);
  }
  return new Date();
}

function gk(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function toMs(ts){
  const p=ts.split(':').map(Number),d=new Date(now2());
  d.setHours(p[0],p[1],p[2]||0,0);
  return d.getTime();
}

function fmt(ms, allowMinus){
  const neg = ms < 0;
  if(neg && !allowMinus) return 'עבר';
  const s=Math.floor(Math.abs(ms)/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=s%60;
  const str=(h>0?h+':':'')+String(m).padStart(2,'0')+':'+String(sc).padStart(2,'0');
  return neg ? '−'+str : str;
}

function fmtClock(d){
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
}

const DAYS=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];

function drawSeg(t){
  const el = document.getElementById('segCanvas');
  if(!el) return;
  el.textContent = t;
  const col = getComputedStyle(document.documentElement).getPropertyValue('--gold').trim()||'#ffd060';
  el.style.color = col;
}

let lastTime="00:00:00";

function updateDebugInputsFromCurrent(){
  const n = now2();
  simulatedISODate = gk(n);
  const dd = String(n.getDate()).padStart(2,'0');
  const mm = String(n.getMonth()+1).padStart(2,'0');
  const yyyy = n.getFullYear();
  document.getElementById('dtDate').value = dd + '/' + mm + '/' + yyyy;
  document.getElementById('dtTime').value = String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')+':'+String(n.getSeconds()).padStart(2,'0');
}

function updHeader(){
  const n=now2(), k=gk(n);
  document.getElementById('hebDate').textContent = H[k] || 'כ״ה אלול תשפ״ו';
  
  const dd = String(n.getDate()).padStart(2,'0');
  const mm = String(n.getMonth()+1).padStart(2,'0');
  const yyyy = n.getFullYear();
  const gregFull = dd + '/' + mm + '/' + yyyy;

  document.getElementById('gregDate').textContent = 'יום '+DAYS[n.getDay()]+' | '+gregFull+(customBaseTime!==null?' 🔧 [דיבוג פעיל]':'');
}

function getTomorrowDateObj(){
  const n=now2(), t=new Date(n);
  t.setDate(t.getDate()+1);
  return t;
}

function getTomorrowKey(){
  return gk(getTomorrowDateObj());
}

function tick(){
  const n=now2(), k=gk(n), t=n.getTime();
  const srStr=getSR(k);
  if(!srStr) return;

  const srMs = toMs(srStr);
  const diffSr = srMs - t;
  const MINUS10 = -600000;

  const tmrKey = getTomorrowKey();
  const tmrStr = getSR(tmrKey);
  
  function toMsDate(ts, dateStr){
    const p=ts.split(':').map(Number);
    const d=new Date(dateStr+'T00:00:00');
    d.setHours(p[0],p[1],p[2]||0,0);
    return d.getTime();
  }
  
  const tmrMs = tmrStr ? toMsDate(tmrStr, tmrKey) : null;
  const oneHrBeforeTmr = tmrMs ? tmrMs - 3600000 : null;

  const inClockMode = diffSr < MINUS10 && (!oneHrBeforeTmr || t < oneHrBeforeTmr);

  const cardCurrentEl = document.getElementById('cardCurrent');
  if(cardCurrentEl) cardCurrentEl.style.display = inClockMode ? 'none' : '';
  document.getElementById('cardsContainer').style.display = inClockMode ? 'none' : '';
  document.getElementById('colorBar').style.display      = inClockMode ? 'none' : '';
  
  const clockEl = document.getElementById('clockMode');
  clockEl.classList.toggle('show', inClockMode);

  document.getElementById('currentTime').textContent = fmtClock(n);

  if(inClockMode){
    lastTime=fmtClock(n);
    drawSeg(lastTime);
    const heb = H[k] || 'כ״ה אלול תשפ״ו';
    const dd = String(n.getDate()).padStart(2,'0');
    const mm = String(n.getMonth()+1).padStart(2,'0');
    const yyyy = n.getFullYear();
    const greg = 'יום ' + DAYS[n.getDay()] + ' | ' + dd + '/' + mm + '/' + yyyy;
    document.getElementById('clockDate').textContent = greg + ' — ' + heb;

    if(tmrStr){
      const remTmr = tmrMs - t;
      const todayOffset = new Date(n.getFullYear(), n.getMonth(), n.getDate()).getTimezoneOffset();
      const tmrDateObj = getTomorrowDateObj();
      const tmrOffset = tmrDateObj.getTimezoneOffset();
      const dstShift = todayOffset - tmrOffset;
      let displayTmr = tmrStr;
      
      if(dstShift > 0){
        const p=tmrStr.split(':').map(Number), tot=p[0]*3600+p[1]*60+p[2]+dstShift*60;
        displayTmr=String(Math.floor(tot/3600)).padStart(2,'0')+':'+String(Math.floor((tot%3600)/60)).padStart(2,'0')+':'+String(tot%60).padStart(2,'0');
      }
      
      document.getElementById('clockTomorrow').innerHTML =
        'זריחה מחר: <span>'+displayTmr+'</span> | עוד '+fmt(remTmr, false);
    }
    return;
  }

  document.getElementById('hanetzTime').textContent = srStr;
  const cdEl = document.getElementById('hanetzCd');
  cdEl.textContent = fmt(diffSr, true);
  cdEl.classList.toggle('minus', diffSr < 0);

  document.getElementById('cardHanetz').classList.toggle('lit', diffSr < 3600000 && diffSr > MINUS10);
}

updateDebugInputsFromCurrent();
tick();

setInterval(()=>{
  updHeader();
  tick();
}, 200);

let wakeLock = null;

async function requestWakeLock() {
  if ('wakeLock' in navigator) {
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } catch (err) {}
  }
}

requestWakeLock();

document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible') {
    await requestWakeLock();
  }
});

function goFS(){
  const e=document.documentElement;
  (e.requestFullscreen||e.webkitRequestFullscreen||e.mozRequestFullScreen||function(){}).call(e);
}

document.addEventListener('click', goFS, {once:true});

let pt=null, tapC=0, tapT=null;

function toggleDbg(){
  const dbg = document.getElementById('dbg');
  if(!dbg.classList.contains('open')){
    updateDebugInputsFromCurrent();
    wireDbgButtons();
    dbg.classList.add('open');
  } else {
    dbg.classList.remove('open');
  }
}

function resetAppCompletely(){
  if(confirm('האם אתה בטוח שברצונך לאפס לחלוטין את האפליקציה ולנקות את כל הנתונים השמורים?')) {
    localStorage.clear();
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        for(let registration of registrations) { registration.unregister(); }
      });
    }
    caches.keys().then(names => {
      for (let name of names) { caches.delete(name); }
    });
    alert('האפליקציה אופסה בהצלחה. הדפדפן יתרענן כעת.');
    window.location.reload();
  }
}

document.addEventListener('touchstart', e=>{
  if(e.target.classList.contains('color-dot')||e.target.classList.contains('db')||e.target.closest('.version-badge')) return;
  pt = setTimeout(toggleDbg, 800);
}, {passive:true});

document.addEventListener('touchend', ()=>clearTimeout(pt), {passive:true});
document.addEventListener('touchmove', ()=>clearTimeout(pt), {passive:true});

document.addEventListener('mousedown', e=>{
  if(e.target.classList.contains('color-dot')||e.target.classList.contains('db')||e.target.closest('.version-badge')) return;
  pt = setTimeout(toggleDbg, 800);
});

document.addEventListener('mouseup', ()=>clearTimeout(pt));

document.addEventListener('click', e=>{
  if(e.target.classList.contains('db') || e.target.closest('#dbg') || e.target.closest('.version-badge')) return;
  tapC++;
  clearTimeout(tapT);
  tapT = setTimeout(()=>tapC=0, 600);
  if(tapC>=3){
    tapC=0;
    toggleDbg();
  }
});

function applyDebugTimeDate(){
  const dateVal = document.getElementById('dtDate').value.trim();
  const timeVal = document.getElementById('dtTime').value;
  
  const parts = dateVal.split('/');
  if(parts.length === 3){
    const d = parts[0].padStart(2,'0');
    const m = parts[1].padStart(2,'0');
    const y = parts[2];
    simulatedISODate = `${y}-${m}-${d}`;
  }
  
  if(!simulatedISODate || !timeVal) return;
  const simDate = new Date(simulatedISODate + 'T' + timeVal);
  customBaseTime = {
    simulated: simDate.getTime(),
    realWall: Date.now()
  };
  
  updHeader(); 
  tick();
  wireDbgButtons();
}

function sdTime(t){
  document.getElementById('dtTime').value = t;
  applyDebugTimeDate();
}

function resetDebug(){
  customBaseTime = null;
  simulatedISODate = null;
  updateDebugInputsFromCurrent();
  updHeader(); 
  tick();
  wireDbgButtons();
}

document.getElementById('dtDate').addEventListener('input', applyDebugTimeDate);
document.getElementById('dtTime').addEventListener('input', applyDebugTimeDate);
document.getElementById('dtDate').addEventListener('change', applyDebugTimeDate);
document.getElementById('dtTime').addEventListener('change', applyDebugTimeDate);

function wireDbgButtons(){
  const k = gk(now2());
  const sr = getSR(k);
  if(!sr) return;
  const [h,m,s] = sr.split(':').map(Number);
  const srSec = h*3600+m*60+s;
  
  function secToTime(sec){
    return String(Math.floor(sec/3600)).padStart(2,'0')+':'+String(Math.floor((sec%3600)/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
  }
  
  document.getElementById('btnHrBefore').onclick = ()=>sdTime(secToTime(srSec-3600));
  document.getElementById('btnSR').onclick        = ()=>sdTime(sr);
  document.getElementById('btnPlus5').onclick    = ()=>sdTime(secToTime(srSec+300));
  document.getElementById('btnPlus12').onclick   = ()=>sdTime(secToTime(srSec+720));
}

wireDbgButtons();
</script>

<script>
if('serviceWorker' in navigator){
  const swCode = `
    const CACHE_NAME = 'hanetz-cache-v80';
    self.addEventListener('install', e => { self.skipWaiting(); });
    self.addEventListener('activate', e => {
      e.waitUntil(
        caches.keys().then(keys => Promise.all(
          keys.map(key => { if(key !== CACHE_NAME) return caches.delete(key); })
        ))
      );
      self.clients.claim();
    });
    self.addEventListener('fetch', e => {
      e.respondWith(
        fetch(e.request).catch(() => caches.match(e.request))
      );
    });
  `;
  const blob = new Blob([swCode], {type: 'application/javascript'});
  const swUrl = URL.createObjectURL(blob);
  
  window.addEventListener('load', async ()=>{
    const reg = await navigator.serviceWorker.register(swUrl).catch(()=>null);
    if(!reg) return;
    reg.update();
  });
}
</script>
</body>
</html>
