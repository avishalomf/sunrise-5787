<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#07080f;--gold:#ffd060;--amber:#ff9020;--cream:#fff8e8;
  --dim:#8a7840;--card1:#130f00;--card2:#1c1400;
  --border1:#4a3200;--border2:#6a4400;--purple:#c0a0ff;
}
body{
  background:var(--bg);color:#fff;
  font-family:'Segoe UI',Arial,sans-serif;
  height:100dvh;overflow:hidden;
  display:flex;flex-direction:column;
  align-items:center;justify-content:space-between;
  padding:2px 6px env(safe-area-inset-bottom,4px);
}

/* ── HEADER & FULL DATE ── */
.header{
  width:100%;text-align:center;
  user-select:none;flex-shrink:0;
}
.heb-date{
  font-size:min(4.8vw,19px);font-weight:900;letter-spacing:1px;
  background:linear-gradient(135deg,var(--gold),var(--amber));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.greg-date{font-size:10px;color:#998;margin-top:0;}

/* ── CURRENT CLOCK BOX ── */
.card-current{
  width:100%;text-align:center;flex-shrink:0;margin:0;
}
.current-time{
  font-size:min(13vw,48px);font-weight:900;
  color:var(--cream);font-variant-numeric:tabular-nums;
  line-height:1;letter-spacing:1px;
  text-shadow:0 0 20px rgba(255,248,232,.15);
}

.version-badge{
  display:inline-block;background:#1a1200;border:1px solid #5a4000;
  color:var(--gold);padding:1px 6px;border-radius:6px;
  font-size:9px;font-family:monospace;cursor:pointer;
}

/* ── HANETZ CARDS (ממוקסמים לגובה ולרוחב) ── */
.cards-container{
  width:100%;flex-grow:1;
  display:flex;flex-direction:column;gap:4px;
  justify-content:center;align-items:center;min-height:0;
}

.card-hanetz{
  width:100%;flex:1;border-radius:14px;
  background:linear-gradient(145deg,var(--card2),#0e0900);
  border:2px solid var(--border2);
  padding:4px 8px;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  transition:border-color .5s,box-shadow .5s;
  position:relative;overflow:hidden;
  min-height:0;
}
.card-hanetz.lit{
  border-color:var(--gold);
  box-shadow:0 0 40px rgba(255,208,96,.3);
}
.hanetz-label{
  font-size:min(3.2vw,12px);color:var(--gold);opacity:.85;
  letter-spacing:1.5px;font-weight:800;
  text-align:center;line-height:1.1;
}
.hanetz-time{
  font-size:min(15vw,68px);font-weight:900;
  color:var(--gold);font-variant-numeric:tabular-nums;
  line-height:1;
  text-shadow:0 0 30px rgba(255,208,96,.4);
}
.hanetz-cd{
  font-size:min(18vw,80px);font-weight:900;
  font-variant-numeric:tabular-nums;
  background:linear-gradient(135deg,var(--cream),var(--gold));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  line-height:1;
  letter-spacing:-1px;
}
.hanetz-cd.minus{
  background:linear-gradient(135deg,#ff9090,#ff4040);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.attr{font-size:8px;color:#2a2015;position:absolute;bottom:1px;right:8px;}

/* ── CLOCK MODE (מסך מלא ענק כפי שביקשת) ── */
.clock-mode{
  display:none;position:fixed;inset:0;
  flex-direction:column;align-items:center;justify-content:center;
  background:var(--bg);z-index:100;gap:2px;
  width:100vw;height:100dvh;padding:2px 4px;
}
.clock-mode.show{display:flex;}

.clock-date{font-size:min(4.5vw,18px);color:#ccc;font-weight:700;text-align:center;}
.clock-tomorrow{font-size:min(4vw,16px);color:#999;text-align:center;}
.clock-tomorrow span{color:var(--gold);}

/* ── COLOR PICKER ── */
.color-bar{
  display:flex;gap:8px;justify-content:center;
  flex-shrink:0;padding:1px 0;
}
.color-dot{
  width:16px;height:16px;border-radius:50%;
  cursor:pointer;border:2px solid transparent;
  transition:border-color .2s,transform .2s;
}
.color-dot.active{border-color:#fff;transform:scale(1.2);}

/* ── DEBUG ── */
.dbg{
  display:none;position:fixed;bottom:0;left:0;right:0;
  background:#0f0a00;border-top:2px solid #aa6600;
  padding:10px;text-align:center;
  z-index:9999;
}
.dbg.open{display:block;}
.dbg input{
  font-size:16px;background:#1a1200;color:var(--gold);
  border:1px solid #5a4000;border-radius:8px;
  padding:4px;width:100%;text-align:center;
  margin-bottom:4px;outline:none;
}
.dbs{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;}
.db{
  background:#1a1000;border:1px solid #5a3800;
  color:#cc9940;border-radius:6px;
  padding:3px 6px;font-size:10px;cursor:pointer;
}

/* Landscape (מצב אופקי - שני כרטיסים זה לצד זה או מוגדלים למקסימום) */
@media(orientation:landscape){
  body{flex-direction:row;flex-wrap:wrap;align-items:flex-start;padding:2px 4px;}
  .header,.color-bar,.dbg{width:100%;}
  .card-current{width:100%;}
  .cards-container{flex-direction:row;gap:6px;height:calc(100dvh - 50px);}
  .card-hanetz{height:100%;}
  .clock-mode{width:100vw;height:100dvh;}
  .heb-date{font-size:min(2.8vw,15px);}
  .current-time{font-size:min(6vw,28px);}
  .hanetz-time{font-size:min(9vw,44px);}
  .hanetz-cd{font-size:min(12vw,60px);}
}

let customBaseTime = null;
let simulatedISODate = null;

function now2(){
  if(customBaseTime !== null){
    const elapsed = Date.now() - customBaseTime.realWall;
    return new Date(customBaseTime.simulated + elapsed);
  }
  return new Date();
}

function gk(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function getSR(k){
  const diff = Math.round((new Date(k+'T00:00:00')-ANCHOR)/864e5);
  if(diff<0||diff>=SR.length) return "06:13:00";
  const v=SR[diff];
  if(v===undefined || v===null) return "06:13:00";
  return String(Math.floor(v/3600)).padStart(2,'0')+':'+String(Math.floor((v%3600)/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0');
}
function toMs(ts){
  const p=ts.split(':').map(Number),d=new Date(now2());
  d.setHours(p[0],p[1],p[2]||0,0); return d.getTime();
}
function fmt(ms, allowMinus){
  const neg = ms < 0;
  if(neg && !allowMinus) return 'עבר';
  const s=Math.floor(Math.abs(ms)/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=s%60;
  const str=(h>0?h+':':'')+String(m).padStart(2,'0')+':'+String(sc).padStart(2,'0');
  return neg ? '−'+str : str;
}
function fmtClock(d){
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
}

const DAYS=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];

function drawSeg(t){
  const el = document.getElementById('segCanvas');
  if(!el) return;
  el.textContent = t;
  const col = getComputedStyle(document.documentElement).getPropertyValue('--gold').trim()||'#ffd060';
  el.style.color = col;
}

  const n = now2();
  simulatedISODate = gk(n);
  const dd = String(n.getDate()).padStart(2,'0');
  const mm = String(n.getMonth()+1).padStart(2,'0');

  const yyyy = n.getFullYear();

  document.getElementById('gregDate').textContent = 'יום '+DAYS[n.getDay()]+' | '+gregFull+(customBaseTime!==null?' 🔧 [דיבוג פעיל]':'');
}

function getTomorrow(){
  const n=now2(), t=new Date(n); t.setDate(t.getDate()+1);
  return gk(t);
}

function tick(){
  const n=now2(), k=gk(n), t=n.getTime();
  const srStr=getSR(k);
  if(!srStr) return;

  const srMs = toMs(srStr);
  const diffSr = srMs - t;
  const MINUS10 = -600000;

  const shmaMs = srMs - 240000; // 4 דקות לפני הנץ

  const tmrStr = getSR(getTomorrow());
  function toMsDate(ts, dateStr){
    const p=ts.split(':').map(Number);
    const d=new Date(dateStr+'T00:00:00');
    d.setHours(p[0],p[1],p[2]||0,0);
    return d.getTime();
  }
  const tmrMs = tmrStr ? toMsDate(tmrStr, getTomorrow()) : null;
  const oneHrBeforeTmr = tmrMs ? tmrMs - 3600000 : null;

  const inClockMode = diffSr < MINUS10 && (!oneHrBeforeTmr || t < oneHrBeforeTmr);

  document.getElementById('cardCurrent').style.display = inClockMode ? 'none' : '';
  document.getElementById('cardsContainer').style.display = inClockMode ? 'none' : '';
  document.getElementById('colorBar').style.display     = inClockMode ? 'none' : '';
  
  const clockEl = document.getElementById('clockMode');
  clockEl.classList.toggle('show', inClockMode);

  document.getElementById('currentTime').textContent = fmtClock(n);

  if(inClockMode){
    lastTime=fmtClock(n); drawSeg(lastTime);
    const heb = H[k] || 'תשפ״ז';
    const dd = String(n.getDate()).padStart(2,'0');
    const mm = String(n.getMonth()+1).padStart(2,'0');
    const yyyy = n.getFullYear();
    const greg = 'יום ' + DAYS[n.getDay()] + ' | ' + dd + '/' + mm + '/' + yyyy;
    document.getElementById('clockDate').textContent = heb + ' — ' + greg;

    if(tmrStr){
      const remTmr = tmrMs - t;
      const todayOffset = new Date(n.getFullYear(), n.getMonth(), n.getDate()).getTimezoneOffset();
      const tmrDate = new Date(getTomorrow()+'T12:00:00');
      const tmrOffset = tmrDate.getTimezoneOffset();
      const dstShift = todayOffset - tmrOffset;
      let displayTmr = tmrStr;
      if(dstShift > 0){
        const p=tmrStr.split(':').map(Number), tot=p[0]*3600+p[1]*60+p[2]+dstShift*60;
        displayTmr=String(Math.floor(tot/3600)).padStart(2,'0')+':'+String(Math.floor((tot%3600)/60)).padStart(2,'0')+':'+String(tot%60).padStart(2,'0');
      }
      document.getElementById('clockTomorrow').innerHTML =
        'זריחה מחר: <span>'+displayTmr+'</span> | עוד '+fmt(remTmr, false);
    }
    return;
  }

  // קריאת שמע (4 דק לפני הנץ)
  const shmaStr = String(Math.floor((srMs - 240000)/3600000)).padStart(2,'0')+':'+String(Math.floor(((srMs - 240000)%3600000)/60000)).padStart(2,'0')+':'+String(Math.floor(((srMs - 240000)%60000)/1000)).padStart(2,'0');
  document.getElementById('shmaTime').textContent = shmaStr;
  const diffShma = shmaMs - t;
  document.getElementById('shmaCd').textContent = fmt(diffShma, true);

  // הנץ החמה
  document.getElementById('hanetzTime').textContent = srStr;
  const cdEl = document.getElementById('hanetzCd');
  cdEl.textContent = fmt(diffSr, true);
  cdEl.classList.toggle('minus', diffSr < 0);

  document.getElementById('cardHanetz').classList.toggle('lit', diffSr < 3600000 && diffSr > MINUS10);
}

function applyDebugTimeDate(){
  const dateVal = document.getElementById('dtDate').value.trim();
  const timeVal = document.getElementById('dtTime').value;
  
  const parts = dateVal.split('/');
  if(parts.length === 3){
    const d = parts[0].padStart(2,'0');
    const m = parts[1].padStart(2,'0');
    const y = parts[2];
    simulatedISODate = `${y}-${m}-${d}`;
  }
  
  if(!simulatedISODate || !timeVal) return;
  const simDate = new Date(simulatedISODate + 'T' + timeVal);
  customBaseTime = {
    simulated: simDate.getTime(),
    realWall: Date.now()
  };
  updHeader(); 
  tick();
  wireDbgButtons();
}

function sdTime(t){
  document.getElementById('dtTime').value = t;
  applyDebugTimeDate();
}

function resetDebug(){
  customBaseTime = null;
  simulatedISODate = null;
  updateDebugInputsFromCurrent();
  updHeader(); 
  tick();
  wireDbgButtons();

function wireDbgButtons(){
  const k = gk(now2());
  const sr = getSR(k);
  if(!sr) return;
  const [h,m,s] = sr.split(':').map(Number);
  const srSec = h*3600+m*60+s;
  function secToTime(sec){ return String(Math.floor(sec/3600)).padStart(2,'0')+':'+String(Math.floor((sec%3600)/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0'); }
  document.getElementById('btnHrBefore').onclick = ()=>sdTime(secToTime(srSec-3600));
  document.getElementById('btnSR').onclick       = ()=>sdTime(sr);
  document.getElementById('btnPlus5').onclick    = ()=>sdTime(secToTime(srSec+300));
  document.getElementById('btnPlus12').onclick   = ()=>sdTime(secToTime(srSec+720));
}

<script>
if('serviceWorker' in navigator){
  const swCode = `
    const CACHE_NAME = 'hanetz-cache-v65';
    self.addEventListener('install', e => { self.skipWaiting(); });
    self.addEventListener('activate', e => {
      e.waitUntil(
        caches.keys().then(keys => Promise.all(
          keys.map(key => { if(key !== CACHE_NAME) return caches.delete(key); })
        ))
      );
      self.clients.claim();
    });
    self.addEventListener('fetch', e => {
      e.respondWith(
        fetch(e.request).catch(() => caches.match(e.request))
      );
    });
  `;
  const blob = new Blob([swCode], {type: 'application/javascript'});
  const swUrl = URL.createObjectURL(blob);
  
  window.addEventListener('load', async ()=>{
    const reg = await navigator.serviceWorker.register(swUrl).catch(()=>null);
    if(!reg) return;
    reg.update();
  });
}
