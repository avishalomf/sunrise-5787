<!-- גרסת אפליקציה: v52 -->
<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>זריחה תשפ״ז</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#07080f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="זריחה">
<!-- Favicon / Icons -->
<link rel="icon" type="image/svg+xml" href="iconSun87.svg">
<link rel="apple-touch-icon" href="iconSun87.svg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#07080f;--gold:#ffd060;--amber:#ff9020;--cream:#fff8e8;
  --dim:#8a7840;--card1:#130f00;--card2:#1c1400;
  --border1:#4a3200;--border2:#6a4400;--purple:#c0a0ff;
}
body{
  background:var(--bg);color:#fff;
  font-family:'Segoe UI',Arial,sans-serif;
  height:100dvh;overflow:hidden;
  display:flex;flex-direction:column;
  align-items:center;justify-content:space-between;
  padding:env(safe-area-inset-top,6px) 10px env(safe-area-inset-bottom,6px);
  gap:4px;
}

/* ── HEADER & FULL DATE ── */
.header{
  width:100%;text-align:center;
  user-select:none;flex-shrink:0;
}
.heb-date{
  font-size:min(5.5vw,21px);font-weight:900;letter-spacing:1px;
  background:linear-gradient(135deg,var(--gold),var(--amber));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.greg-date{font-size:12px;color:#998;margin-top:1px;}
.version-badge{
  display:inline-block;background:#1a1200;border:1px solid #5a4000;
  color:var(--gold);padding:1px 6px;border-radius:6px;
  font-size:10px;font-family:monospace;cursor:pointer;margin-top:2px;
}

/* ── CURRENT CLOCK BOX (Compact & Centered, not full width) ── */
.card-current{
  width:auto;min-width:180px;max-width:90%;border-radius:12px;
  background:linear-gradient(145deg,var(--card1),#0b0900);
  border:1px solid var(--border1);
  padding:4px 16px;flex-shrink:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:0px;margin:0 auto;
}
.current-time-label{font-size:9.5px;color:var(--dim);letter-spacing:1.5px;font-weight:700;}
.current-time{
  font-size:min(7vw,28px);font-weight:900;
  color:var(--cream);font-variant-numeric:tabular-nums;
  line-height:1.1;letter-spacing:1px;
}

/* ── HANETZ CARD (main big) ── */
.card-hanetz{
  width:100%;border-radius:18px;
  background:linear-gradient(145deg,var(--card2),#0e0900);
  border:2px solid var(--border2);
  padding:12px 14px;flex-grow:1;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  transition:border-color .5s,box-shadow .5s;
  position:relative;overflow:hidden;
}
.card-hanetz.lit{
  border-color:var(--gold);
  box-shadow:0 0 50px rgba(255,208,96,.35);
}
.hanetz-label{
  font-size:13px;color:var(--gold);opacity:.85;
  letter-spacing:2px;margin-bottom:2px;font-weight:800;
  text-align:center;
}
.hanetz-time{
  font-size:min(16vw,75px);font-weight:900;
  color:var(--gold);font-variant-numeric:tabular-nums;
  line-height:1;
  text-shadow:0 0 50px rgba(255,208,96,.6),0 0 15px rgba(255,208,96,.3);
  margin-bottom:4px;
}
.hanetz-cd{
  font-size:min(18vw,75px);font-weight:900;
  font-variant-numeric:tabular-nums;
  background:linear-gradient(135deg,var(--cream),var(--gold));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  line-height:1;
}
.hanetz-cd.minus{
  background:linear-gradient(135deg,#ff9090,#ff4040);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.attr{font-size:10px;color:#2a2015;position:absolute;bottom:6px;right:12px;}

/* ── CLOCK MODE (after 10 min past sunrise) ── */
.clock-mode{
  display:none;position:fixed;inset:0;
  flex-direction:column;align-items:center;justify-content:center;
  background:var(--bg);z-index:100;gap:4px;
  padding:0;margin:0;
}
.clock-mode.show{display:flex;}
@media(orientation:landscape){
  .clock-date{font-size:4.5vh!important;}
  .clock-tomorrow{font-size:4vh!important;}
}

.clock-date{font-size:min(5.5vw,24px);color:#ccc;margin-top:6px;font-weight:700;text-align:center;}
.clock-tomorrow{font-size:min(5vw,22px);color:#999;margin-top:2px;text-align:center;}
.clock-tomorrow span{color:var(--gold);}

/* ── BANNER ── */
.banner{
  display:none;width:100%;border-radius:12px;
  padding:10px;text-align:center;
  font-size:16px;font-weight:800;flex-shrink:0;
}
.banner.show{display:block;}
.banner.red{background:linear-gradient(135deg,#0a0000,#150000);border:2px solid #c03030;color:#ff8080;}

/* ── COLOR PICKER ── */
.color-bar{
  display:flex;gap:8px;justify-content:center;
  flex-shrink:0;padding:2px 0;
}
.color-dot{
  width:20px;height:20px;border-radius:50%;
  cursor:pointer;border:2px solid transparent;
  transition:border-color .2s,transform .2s;
}
.color-dot.active{border-color:#fff;transform:scale(1.2);}

/* ── DEBUG ── */
.dbg{
  display:none;position:fixed;bottom:0;left:0;right:0;
  background:#0f0a00;border-top:2px solid #aa6600;
  padding:14px;text-align:center;
  z-index:9999;
}
.dbg.open{display:block;}
.dbg input{
  font-size:18px;background:#1a1200;color:var(--gold);
  border:1px solid #5a4000;border-radius:8px;
  padding:5px;width:100%;text-align:center;
  margin-bottom:6px;outline:none;
}
.dbs{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;}
.db{
  background:#1a1000;border:1px solid #5a3800;
  color:#cc9940;border-radius:6px;
  padding:4px 8px;font-size:11px;cursor:pointer;
}

/* Landscape */
@media(orientation:landscape){
  body{flex-direction:row;flex-wrap:wrap;align-items:flex-start;padding:4px 8px;}
  .header,.banner,.color-bar,.dbg{width:100%;}
  .card-current{width:auto;}
  .card-hanetz{width:100%;}
  .clock-mode{width:100%;}
  .heb-date{font-size:min(3.5vw,20px);}
  .hanetz-time{font-size:min(8vw,42px);}
  .hanetz-cd{font-size:min(10vw,55px);}
}
</style>
</head>
<body>

<div class="header" id="hdrEl">
  <div class="heb-date" id="hebDate">טוען...</div>
  <div class="greg-date" id="gregDate"></div>
  <div><div class="version-badge" onclick="toggleDbg()">גרסה v52 🔧 (לחץ לפתיחת דיבוג)</div></div>
</div>

<div class="banner" id="banner"></div>

<div class="card-current" id="cardCurrent">
  <div class="current-time-label">שעה נוכחית</div>
  <div class="current-time" id="currentTime">--:--:--</div>
</div>

<div class="card-hanetz" id="cardHanetz">
  <div class="hanetz-label">הנץ החמה — תפילת עמידה</div>
  <div class="hanetz-time" id="hanetzTime">--:--:--</div>
  <div class="hanetz-cd" id="hanetzCd">--:--:--</div>
  <div class="attr">לוח צלותיה דאברהם • תשפ״ז</div>
</div>

<!-- Clock mode: shown after +10min past sunrise -->
<div class="clock-mode" id="clockMode">
  <div id="segCanvas" style="font-size:min(18vw,48vh);font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-1px;color:var(--gold);font-family:'Courier New',monospace;text-align:center;width:100%;line-height:1;padding:0;overflow:hidden;white-space:nowrap;transform:scaleY(1.6);transform-origin:center center;display:block;"></div>
  <div class="clock-date" id="clockDate"></div>
  <div class="clock-tomorrow" id="clockTomorrow"></div>
  <div class="color-bar" id="colorBarClock" style="margin-top:6px;opacity:0;transition:opacity .3s;"></div>
  <div style="position:absolute;bottom:8px;left:10px;"><div class="version-badge" onclick="toggleDbg()">גרסה v52 🔧</div></div>
</div>

<!-- Color theme picker -->
<div class="color-bar" id="colorBar" style="opacity:0;transition:opacity .3s;">
  <div class="color-dot active" data-theme="gold"    style="background:linear-gradient(135deg,#ffd060,#ff9020)" title="זהב"></div>
  <div class="color-dot"        data-theme="blue"    style="background:linear-gradient(135deg,#60c0ff,#2060ff)" title="כחול"></div>
  <div class="color-dot"        data-theme="green"   style="background:linear-gradient(135deg,#60ffa0,#10a040)" title="ירוק"></div>
  <div class="color-dot"        data-theme="purple"  style="background:linear-gradient(135deg,#d080ff,#8020c0)" title="סגול"></div>
  <div class="color-dot"        data-theme="white"   style="background:linear-gradient(135deg,#ffffff,#aaaaaa)" title="לבן"></div>
  <div class="color-dot"        data-theme="yellow"  style="background:linear-gradient(135deg,#ffee00,#ffaa00)" title="צהוב עז"></div>
</div>

<div class="dbg" id="dbg">
  <div style="font-size:11px;color:var(--dim);margin-bottom:2px;text-align:right;">בדיקת תאריך:</div>
  <input type="date" id="dtDate">
  <div style="font-size:11px;color:var(--dim);margin-bottom:2px;text-align:right;">בדיקת שעה:</div>
  <input type="time" id="dtTime" step="1">
  <div class="dbs">
    <button class="db" onclick="sdTime('04:00:00')">04:00</button>
    <button class="db" id="btnHrBefore">שעה לפני</button>
    <button class="db" id="btnSR">הנץ</button>
    <button class="db" id="btnPlus5">+5 דק׳</button>
    <button class="db" id="btnPlus12">+12 דק׳</button>
    <button class="db" onclick="sdTime('14:00:00')">14:00</button>
    <button class="db" onclick="resetDebug()">⟳ אמיתי</button>
    <button class="db" onclick="exitFS()">יציאה ממסך מלא</button>
    <button class="db" onclick="document.getElementById('dbg').classList.remove('open')">סגור</button>
  </div>
</div>

<script>
// ── DATA תשפ״ז ────────────────────────────────────────────────────────
const H={
  "2026-09-11": "א' תשרי", "2026-09-12": "ב' תשרי", "2026-09-13": "ג' תשרי", "2026-09-14": "ד' תשרי", "2026-09-15": "ה' תשרי", "2026-09-16": "ו' תשרי", "2026-09-17": "ז' תשרי", "2026-09-18": "ח' תשרי", "2026-09-19": "ט' תשרי", "2026-09-20": "י' תשרי",
  "2026-09-21": "יא' תשרי", "2026-09-22": "יב' תשרי", "2026-09-23": "יג' תשרי", "2026-09-24": "יד' תשרי", "2026-09-25": "טו' תשרי", "2026-09-26": "טז' תשרי", "2026-09-27": "יז' תשרי", "2026-09-28": "חי' תשרי", "2026-09-29": "יט' תשרי", "2026-09-30": "כ' תשרי",
  "2026-10-01": "כא' תשרי", "2026-10-02": "כב' תשרי", "2026-10-03": "כג' תשרי", "2026-10-04": "כד' תשרי", "2026-10-05": "כה' תשרי", "2026-10-06": "כו' תשרי", "2026-10-07": "כז' תשרי", "2026-10-08": "כח' תשרי", "2026-10-09": "כט' תשרי", "2026-10-10": "ל' תשרי"
}; 
const SR=[
  22380, 22440, 22500, 22560, 22620, 22680, 22740, 22800, 22860, 22920,
  22980, 23040, 23100, 23160, 23220, 23280, 23340, 23400, 23460, 23520,
  23580, 23640, 23700, 23760, 23820, 23880, 23940, 24000, 24060, 24120
]; 

const ANCHOR = new Date('2026-09-11T00:00:00'); // א' תשרי תשפ"ז
const THEMES = {
  gold:   {main:'#ffd060',sub:'#ff9020',cd:'#fff8e8',shma:'#ffe090'},
  blue:   {main:'#60c0ff',sub:'#2060ff',cd:'#e0f0ff',shma:'#a0d0ff'},
  green:  {main:'#60ffa0',sub:'#10a040',cd:'#e0ffe8',shma:'#a0ffb0'},
  purple: {main:'#d080ff',sub:'#8020c0',cd:'#f0e0ff',shma:'#d0a0ff'},
  white:  {main:'#ffffff',sub:'#aaaaaa',cd:'#ffffff',shma:'#dddddd'},
  yellow: {main:'#ffee00',sub:'#ffaa00',cd:'#ffff88',shma:'#ffee44'},
};
let currentTheme = localStorage.getItem('theme')||'gold';

function applyTheme(name){
  const t = THEMES[name]||THEMES.gold;
  document.documentElement.style.setProperty('--gold', t.main);
  document.documentElement.style.setProperty('--amber', t.sub);
  document.documentElement.style.setProperty('--cream', t.cd);
  document.querySelectorAll('.color-dot').forEach(d=>{
    d.classList.toggle('active', d.dataset.theme===name);
  });
  currentTheme = name;
  localStorage.setItem('theme', name);
  if(document.getElementById('clockMode').classList.contains('show'))
    drawSeg(lastTime||'00:00:00');
  buildClockBar();
}

function buildClockBar(){
  const src = document.getElementById('colorBar');
  const dst = document.getElementById('colorBarClock');
  if(!src || !dst) return;
  dst.innerHTML = src.innerHTML;
  dst.querySelectorAll('.color-dot').forEach(d=>{
    d.classList.toggle('active', d.dataset.theme===currentTheme);
    d.addEventListener('click', ()=>applyTheme(d.dataset.theme));
  });
}
document.querySelectorAll('.color-dot').forEach(d=>{
  d.addEventListener('click', ()=>{
    applyTheme(d.dataset.theme);
    buildClockBar();
  });
});
applyTheme(currentTheme);

let hideTimer=null;
let hideTimerMain=null;
document.getElementById('clockMode').addEventListener('click', e=>{
  if(e.target.classList.contains('color-dot')||e.target.closest('.version-badge')) return;
  const bar = document.getElementById('colorBarClock');
  bar.style.opacity='1';
  clearTimeout(hideTimer);
  hideTimer = setTimeout(()=>{ bar.style.opacity='0'; }, 3000);
});
document.body.addEventListener('click', e=>{
  if(e.target.classList.contains('color-dot')||e.target.closest('#clockMode')||e.target.closest('#dbg')||e.target.closest('.version-badge')) return;
  const bar = document.getElementById('colorBar');
  bar.style.opacity='1';
  clearTimeout(hideTimerMain);
  hideTimerMain = setTimeout(()=>{ bar.style.opacity='0'; }, 3000);
});

let customBaseTime = null;

function now2(){
  if(customBaseTime !== null){
    const elapsed = Date.now() - customBaseTime.realWall;
    return new Date(customBaseTime.simulated + elapsed);
  }
  return new Date();
}

function gk(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function getSR(k){
  const diff = Math.round((new Date(k+'T00:00:00')-ANCHOR)/864e5);
  if(diff<0||diff>=SR.length) return "06:13:00";
  const v=SR[diff];
  if(v===undefined || v===null) return "06:13:00";
  return String(Math.floor(v/3600)).padStart(2,'0')+':'+String(Math.floor((v%3600)/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0');
}
function toMs(ts){
  const p=ts.split(':').map(Number),d=new Date(now2());
  d.setHours(p[0],p[1],p[2]||0,0); return d.getTime();
}
function fmt(ms, allowMinus){
  const neg = ms < 0;
  if(neg && !allowMinus) return 'עבר';
  const s=Math.floor(Math.abs(ms)/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=s%60;
  const str=(h>0?h+':':'')+String(m).padStart(2,'0')+':'+String(sc).padStart(2,'0');
  return neg ? '−'+str : str;
}
function fmtClock(d){
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
}

const DAYS=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];

function drawSeg(t){
  const el = document.getElementById('segCanvas');
  if(!el) return;
  el.textContent = t;
  const col = getComputedStyle(document.documentElement).getPropertyValue('--gold').trim()||'#ffd060';
  el.style.color = col;
}
let lastTime="00:00:00";

function updateDebugInputsFromCurrent(){
  const n = now2();
  document.getElementById('dtDate').value = gk(n);
  document.getElementById('dtTime').value = String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')+':'+String(n.getSeconds()).padStart(2,'0');
}

function updHeader(){
  const n=now2(), k=gk(n);
  document.getElementById('hebDate').textContent = (H[k] ? H[k] + ' תשפ״ז' : 'תשפ״ז');
  
  // פורמט תאריך ישראלי: DD/MM/YYYY
  const dd = String(n.getDate()).padStart(2,'0');
  const mm = String(n.getMonth()+1).padStart(2,'0');
  const yyyy = n.getFullYear();
  const gregFull = dd + '/' + mm + '/' + yyyy;

  document.getElementById('gregDate').textContent = 'יום '+DAYS[n.getDay()]+' | '+gregFull+(customBaseTime!==null?' 🔧 [דיבוג פעיל]':'');
}

function getTomorrow(){
  const n=now2(), t=new Date(n); t.setDate(t.getDate()+1);
  return gk(t);
}

function tick(){
  const n=now2(), k=gk(n), t=n.getTime();
  const srStr=getSR(k);
  if(!srStr) return;

  const srMs = toMs(srStr);
  const diffSr = srMs - t;

  const MINUS10 = -600000;

  const tmrStr = getSR(getTomorrow());
  function toMsDate(ts, dateStr){
    const p=ts.split(':').map(Number);
    const d=new Date(dateStr+'T00:00:00');
    d.setHours(p[0],p[1],p[2]||0,0);
    return d.getTime();
  }
  const tmrMs = tmrStr ? toMsDate(tmrStr, getTomorrow()) : null;
  const oneHrBeforeTmr = tmrMs ? tmrMs - 3600000 : null;

  const inClockMode = diffSr < MINUS10 && (!oneHrBeforeTmr || t < oneHrBeforeTmr);

  document.getElementById('cardCurrent').style.display = inClockMode ? 'none' : '';
  document.getElementById('cardHanetz').style.display   = inClockMode ? 'none' : '';
  document.getElementById('colorBar').style.display     = inClockMode ? 'none' : '';
  document.getElementById('clockMode').classList.toggle('show', inClockMode);

  document.getElementById('currentTime').textContent = fmtClock(n);

  if(inClockMode){
    lastTime=fmtClock(n); drawSeg(lastTime);
    const heb = (H[k] ? H[k] + ' תשפ״ז' : 'תשפ״ז');
    const dd = String(n.getDate()).padStart(2,'0');
    const mm = String(n.getMonth()+1).padStart(2,'0');
    const yyyy = n.getFullYear();
    const greg = 'יום ' + DAYS[n.getDay()] + ' | ' + dd + '/' + mm + '/' + yyyy;
    document.getElementById('clockDate').textContent = heb + ' — ' + greg;

    if(tmrStr){
      const remTmr = tmrMs - t;
      const todayOffset = new Date(n.getFullYear(), n.getMonth(), n.getDate()).getTimezoneOffset();
      const tmrDate = new Date(getTomorrow()+'T12:00:00');
      const tmrOffset = tmrDate.getTimezoneOffset();
      const dstShift = todayOffset - tmrOffset;
      let displayTmr = tmrStr;
      if(dstShift > 0){
        const p=tmrStr.split(':').map(Number), tot=p[0]*3600+p[1]*60+p[2]+dstShift*60;
        displayTmr=String(Math.floor(tot/3600)).padStart(2,'0')+':'+String(Math.floor((tot%3600)/60)).padStart(2,'0')+':'+String(tot%60).padStart(2,'0');
      }
      document.getElementById('clockTomorrow').innerHTML =
        'זריחה מחר: <span>'+displayTmr+'</span> | עוד '+fmt(remTmr, false);
    }
    return;
  }

  document.getElementById('hanetzTime').textContent = srStr;

  const cdEl = document.getElementById('hanetzCd');
  cdEl.textContent = fmt(diffSr, true);
  cdEl.classList.toggle('minus', diffSr < 0);

  document.getElementById('cardHanetz').classList.toggle('lit', diffSr < 3600000 && diffSr > MINUS10);
}

updateDebugInputsFromCurrent();
tick();
setInterval(()=>{ updHeader(); tick(); }, 200);

try{navigator.wakeLock.request('screen').then(()=>{
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible') navigator.wakeLock.request('screen').catch(()=>{});
  });
})}catch(e){}

function goFS(){
  const e=document.documentElement;
  (e.requestFullscreen||e.webkitRequestFullscreen||e.mozRequestFullScreen||function(){}
  ).call(e);
}
document.addEventListener('click',goFS,{once:true});

let pt=null, tapC=0, tapT=null;
function toggleDbg(){
  const dbg = document.getElementById('dbg');
  if(!dbg.classList.contains('open')){
    updateDebugInputsFromCurrent();
    wireDbgButtons();
    dbg.classList.add('open');
  } else {
    dbg.classList.remove('open');
  }
}

document.addEventListener('touchstart', e=>{
  if(e.target.classList.contains('color-dot')||e.target.classList.contains('db')||e.target.closest('.version-badge')) return;
  pt = setTimeout(toggleDbg, 800);
}, {passive:true});
document.addEventListener('touchend', ()=>clearTimeout(pt), {passive:true});
document.addEventListener('touchmove', ()=>clearTimeout(pt), {passive:true});

document.addEventListener('mousedown', e=>{
  if(e.target.classList.contains('color-dot')||e.target.classList.contains('db')||e.target.closest('.version-badge')) return;
  pt = setTimeout(toggleDbg, 800);
});
document.addEventListener('mouseup', ()=>clearTimeout(pt));

document.addEventListener('click', e=>{
  if(e.target.classList.contains('db') || e.target.closest('#dbg') || e.target.closest('.version-badge')) return;
  tapC++; clearTimeout(tapT);
  tapT = setTimeout(()=>tapC=0, 600);
  if(tapC>=3){ tapC=0; toggleDbg(); }
});

function applyDebugTimeDate(){
  const dateVal = document.getElementById('dtDate').value;
  const timeVal = document.getElementById('dtTime').value;
  if(!dateVal || !timeVal) return;
  const simDate = new Date(dateVal + 'T' + timeVal);
  customBaseTime = {
    simulated: simDate.getTime(),
    realWall: Date.now()
  };
  updHeader(); 
  tick();
  wireDbgButtons();
}

function sdTime(t){
  document.getElementById('dtTime').value = t;
  applyDebugTimeDate();
}

function resetDebug(){
  customBaseTime = null;
  updateDebugInputsFromCurrent();
  updHeader(); 
  tick();
  wireDbgButtons();
}

document.getElementById('dtDate').addEventListener('input', applyDebugTimeDate);
document.getElementById('dtTime').addEventListener('input', applyDebugTimeDate);
document.getElementById('dtDate').addEventListener('change', applyDebugTimeDate);
document.getElementById('dtTime').addEventListener('change', applyDebugTimeDate);

function exitFS(){
  (document.exitFullscreen||document.webkitExitFullscreen||document.mozCancelFullScreen||function(){}).call(document);
}

function wireDbgButtons(){
  const k = gk(now2());
  const sr = getSR(k);
  if(!sr) return;
  const [h,m,s] = sr.split(':').map(Number);
  const srSec = h*3600+m*60+s;
  function secToTime(sec){ return String(Math.floor(sec/3600)).padStart(2,'0')+':'+String(Math.floor((sec%3600)/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0'); }
  document.getElementById('btnHrBefore').onclick = ()=>sdTime(secToTime(srSec-3600));
  document.getElementById('btnSR').onclick       = ()=>sdTime(sr);
  document.getElementById('btnPlus5').onclick    = ()=>sdTime(secToTime(srSec+300));
  document.getElementById('btnPlus12').onclick   = ()=>sdTime(secToTime(srSec+720));
}
wireDbgButtons();
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', async ()=>{
    const reg = await navigator.serviceWorker.register('./sw.js').catch(()=>null);
    if(!reg) return;
    reg.update();
    reg.addEventListener('updatefound', ()=>{
      const newSW = reg.installing;
      newSW.addEventListener('statechange', ()=>{
        if(newSW.state === 'installed' && navigator.serviceWorker.controller){
          newSW.postMessage({type:'SKIP_WAITING'});
        }
      });
    });
    navigator.serviceWorker.addEventListener('controllerchange', ()=>{
      window.location.reload();
    });
  });
}
</script>
