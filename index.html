<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#07080f;--gold:#ffd060;--amber:#ff9020;--cream:#fff8e8;
  --dim:#8a7840;--card2:#1c1400;--border2:#6a4400;
}
body{
  background:var(--bg);color:#fff;
  font-family:'Segoe UI',Arial,sans-serif;
  height:100dvh;overflow:hidden;
  display:flex;flex-direction:column;
  align-items:center;justify-content:space-between;
  padding:2px 4px env(safe-area-inset-bottom,4px);
}

/* ── HEADER & TOP SECTION ── */
.header{
  width:100%;text-align:center;
  user-select:none;flex-shrink:0;
}
.heb-date{
  font-size:min(3.5vw,13px);font-weight:900;letter-spacing:1px;
  background:linear-gradient(135deg,var(--gold),var(--amber));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.greg-date{font-size:8px;color:#998;margin-top:0px;}

/* Top Row for Landscape merging */
.top-info-row{
  display:flex;align-items:center;justify-content:center;width:100%;gap:15px;
}

/* ── CURRENT CLOCK BOX ── */
.card-current{
  text-align:center;flex-shrink:0;margin:0;
}
.current-time{
  font-size:min(12vw, 22vh);font-weight:900;
  color:var(--cream);font-variant-numeric:tabular-nums;
  line-height:1;letter-spacing:-1px;
  text-shadow:0 0 20px rgba(255,248,232,.2);
}

.version-badge{
  display:inline-block;background:#1a1200;border:1px solid #5a4000;
  color:var(--gold);padding:1px 6px;border-radius:4px;
  font-size:8px;font-family:monospace;cursor:pointer;
}

/* ── HANETZ CARDS (MAXIMIZED) ── */
.cards-container{
  width:100%;flex-grow:1;
  display:flex;flex-direction:column;gap:2px;
  justify-content:center;align-items:center;min-height:0;
}

.card-hanetz{
  width:100%;flex:1;border-radius:10px;
  background:linear-gradient(145deg,var(--card2),#0e0900);
  border:2px solid var(--border2);
  padding:1px 4px;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  transition:border-color .5s,box-shadow .5s;
  position:relative;overflow:hidden;
  min-height:0;
}
.card-hanetz.lit{
  border-color:var(--gold);
  box-shadow:0 0 30px rgba(255,208,96,.3);
}
.hanetz-label{
  font-size:min(2.5vw,10px);color:var(--gold);opacity:.85;
  letter-spacing:1px;font-weight:800;
  text-align:center;line-height:1;margin-bottom:0;
}
.hanetz-time{
  font-size:min(12vw, 22vh);font-weight:900;
  color:var(--gold);font-variant-numeric:tabular-nums;
  line-height:1;margin-bottom:0;letter-spacing:-1px;
}
.hanetz-cd{
  font-size:min(32vw, 56vh);font-weight:900;
  font-variant-numeric:tabular-nums;
  background:linear-gradient(135deg,var(--cream),var(--gold));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  line-height:0.9;letter-spacing:-2px;
}
.hanetz-cd.minus{
  background:linear-gradient(135deg,#ff9090,#ff4040);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.attr{font-size:7px;color:#3a2815;position:absolute;bottom:0px;right:6px;}

/* Inline Hanetz display for Landscape top row */
.inline-hanetz{
  display:none;text-align:center;
}
.inline-hanetz-time{
  font-size:min(12vw, 22vh);font-weight:900;
  color:var(--gold);font-variant-numeric:tabular-nums;
  line-height:1;letter-spacing:-1px;
  text-shadow:0 0 20px rgba(255,208,96,.4);
}

/* ── CLOCK MODE (MAX SCREEN) ── */
.clock-mode{
  display:none;position:fixed;inset:0;
  flex-direction:column;align-items:center;justify-content:center;
  background:var(--bg);z-index:100;gap:2px;
  width:100vw;height:100dvh;padding:2px 4px;
}
.clock-mode.show{display:flex;}

.clock-live-time{
  font-size:min(32vw, 58vh);font-weight:900;font-variant-numeric:tabular-nums;
  letter-spacing:-2px;color:var(--gold);font-family:'Segoe UI',Arial,sans-serif;
  text-align:center;width:100%;line-height:1;
  text-shadow:0 0 35px rgba(255,208,96,0.35);
}
.clock-date{font-size:min(8vw,30px);color:#ccc;font-weight:700;text-align:center;}
.clock-tomorrow{font-size:min(7vw,28px);color:#999;text-align:center;}
.clock-tomorrow span{color:var(--gold);}

/* ── COLOR PICKER ── */
.color-bar{
  display:flex;gap:6px;justify-content:center;
  flex-shrink:0;padding:1px 0;
}
.color-dot{
  width:14px;height:14px;border-radius:50%;
  cursor:pointer;border:2px solid transparent;
  transition:border-color .2s,transform .2s;
}
.color-dot.active{border-color:#fff;transform:scale(1.2);}

/* ── DEBUG ── */
.dbg{
  display:none;position:fixed;bottom:0;left:0;right:0;
  background:#0f0a00;border-top:2px solid #aa6600;
  padding:6px 8px;text-align:center;
  z-index:9999;max-height:90dvh;overflow-y:auto;
}
.dbg.open{display:block;}
.dbg input{
  font-size:14px;background:#1a1200;color:var(--gold);
  border:1px solid #5a4000;border-radius:6px;
  padding:3px;width:100%;text-align:center;
  margin-bottom:3px;outline:none;
}
.dbs{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;}
.db{
  background:#1a1000;border:1px solid #5a3800;
  color:#cc9940;border-radius:4px;
  padding:6px 10px;font-size:11px;cursor:pointer;font-weight:600;
}
.db.reset-app{background:#3a1010;border-color:#8a2020;color:#ff9090;font-weight:bold;}

/* Landscape Adjustments */
@media(orientation:landscape){
  body{flex-direction:row;flex-wrap:wrap;align-items:flex-start;padding:1px;}
  .header,.color-bar,.dbg{width:100%;}
  .cards-container{flex-direction:row;gap:4px;height:calc(100dvh - 35px);}
  .card-hanetz{display:none;} /* הסתרת כרטיס הנץ המלא באופקי כדי לפנות את כל הגובה לטיימר */
  .inline-hanetz{display:block;} /* הצגת שעת הנץ בשורה העליונה משص קודם הזמן הנוכחי */
  .clock-mode{width:100vw;height:100dvh;}
  .heb-date{font-size:min(2vw,11px);}
  .current-time,.inline-hanetz-time{font-size:min(11vw, 20vh);}
  .hanetz-cd{font-size:min(35vw, 78vh);} /* טיימר ענק שתופס כמעט את כל המסך באופקי */
}
</style>

function getSR(k){
  if(TABLE_SR.אלול_custom[k]) return TABLE_SR.אלול_custom[k];
  const heb=H[k];
  if(!heb) return null;
  const [dayStr, monthStr] = heb.split(/\s+/);
  const dayIndex=hebrewLiteralToIndex(dayStr);
  const monthArr=TABLE_SR[monthStr];
  if(dayIndex<0 || !monthArr) return null;
  return monthArr[Math.min(dayIndex, monthArr.length-1)] || null;
}

function hebrewLiteralToIndex(str){
  const map={"א'":0,"ב'":1,"ג'":2,"ד'":3,"ה'":4,"ו'":5,"ז'":6,"ח'":7,"ט'":8,"י'":9,"יא'":10,"יב'":11,"יג'":12,"יד'":13,"טו'":14,"טז'":15,"יז'":16,"יח'":17,"יט'":18,"כ'":19,"כא'":20,"כב'":21,"כג'":22,"כד'":23,"כה'":24,"כו'":25,"כז'":26,"כח'":27,"כט'":28,"ל'":29,"כ״א":20,"כ״ב":21,"כ״ג":22,"כ״ד":23,"כ״ה":24,"כ״ו":25,"כ״ז":26,"כ״ח":27,"כ״ט":28,"חי'":17};
  const normalized=String(str).replace(/׳/g,"'").replace(/״/g,'"');
  return Object.prototype.hasOwnProperty.call(map,normalized) ? map[normalized] : -1;
}

const THEMES = {
  gold:   {main:'#ffd060',sub:'#ff9020',cd:'#fff8e8'},
  blue:   {main:'#60c0ff',sub:'#2060ff',cd:'#e0f0ff'},
  green:  {main:'#60ffa0',sub:'#10a040',cd:'#e0ffe8'},
  purple: {main:'#d080ff',sub:'#8020c0',cd:'#f0e0ff'},
  white:  {main:'#ffffff',sub:'#aaaaaa',cd:'#ffffff'},
  yellow: {main:'#ffee00',sub:'#ffaa00',cd:'#ffff88'},
};
const savedTheme=localStorage.getItem('theme');
let currentTheme=THEMES[savedTheme] ? savedTheme : 'gold';

function applyTheme(name){
  const t = THEMES[name]||THEMES.gold;
  document.documentElement.style.setProperty('--gold', t.main);
  document.documentElement.style.setProperty('--amber', t.sub);
  document.documentElement.style.setProperty('--cream', t.cd);
  document.querySelectorAll('.color-dot').forEach(d=>{
    d.classList.toggle('active', d.dataset.theme===name);
  });
  currentTheme = name;
  localStorage.setItem('theme', name);
  if(document.getElementById('clockMode').classList.contains('show'))
    drawSeg(lastTime||'00:00:00');

}

function buildClockBar(){
  const src = document.getElementById('colorBar');
  const dst = document.getElementById('colorBarClock');
  if(!src || !dst) return;
  dst.innerHTML = src.innerHTML;
  dst.querySelectorAll('.color-dot').forEach(d=>{
    d.classList.toggle('active', d.dataset.theme===currentTheme);
    d.addEventListener('click', ()=>applyTheme(d.dataset.theme));

}
document.querySelectorAll('.color-dot').forEach(d=>{
  d.addEventListener('click', ()=>{
    applyTheme(d.dataset.theme);
    buildClockBar();

});

let customBaseTime = null;
let simulatedISODate = null;

function now2(){
  if(customBaseTime !== null){
    const elapsed = Date.now() - customBaseTime.realWall;
    return new Date(customBaseTime.simulated + elapsed);
  }
  return new Date();
}

function gk(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

function timeToMs(ts, baseDate){
  if(!ts || !baseDate) return null;
  const p=ts.split(':').map(Number);
  if(p.length<2 || p.some(n=>!Number.isFinite(n))) return null;
  const d=new Date(baseDate);
  d.setHours(p[0],p[1],p[2]||0,0);
  return d.getTime();
}
function fmt(ms, allowMinus){
  if(ms===null || !Number.isFinite(ms)) return '--:--:--';
  const neg=ms<0;
  if(neg && !allowMinus) return 'עבר';
  const sec=Math.floor(Math.abs(ms)/1000),h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),sc=sec%60;
  const str=(h>0?h+':':'')+String(m).padStart(2,'0')+':'+String(sc).padStart(2,'0');
  return neg ? '−'+str : str;
}
function fmtClock(d){
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
}

const DAYS=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];

function drawSeg(t){
  const el = document.getElementById('segCanvas');
  if(!el) return;
  el.textContent = t;
  const col = getComputedStyle(document.documentElement).getPropertyValue('--gold').trim()||'#ffd060';
  el.style.color = col;
}
let lastTime="00:00:00";

function updateDebugInputsFromCurrent(){
  const n = now2();
  simulatedISODate = gk(n);
  const dd = String(n.getDate()).padStart(2,'0');
  const mm = String(n.getMonth()+1).padStart(2,'0');
  const yyyy = n.getFullYear();
  document.getElementById('dtDate').value = dd + '/' + mm + '/' + yyyy;
  document.getElementById('dtTime').value = String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')+':'+String(n.getSeconds()).padStart(2,'0');
}

function updHeader(){
  const n=now2(), k=gk(n);
  document.getElementById('hebDate').textContent = H[k] || 'כ״ה אלול תשפ״ו';
  
  const dd = String(n.getDate()).padStart(2,'0');
  const mm = String(n.getMonth()+1).padStart(2,'0');
  const yyyy = n.getFullYear();
  const gregFull = dd + '/' + mm + '/' + yyyy;

  document.getElementById('gregDate').textContent = 'יום '+DAYS[n.getDay()]+' | '+gregFull+(customBaseTime!==null?' 🔧 [דיבוג פעיל]':'');
}

function getTomorrowDateObj(){
  const n=now2(), t=new Date(n); t.setDate(t.getDate()+1);
  return t;
}
function getTomorrowKey(){ return gk(getTomorrowDateObj()); }

function tick(){
  const n=now2(), k=gk(n), t=n.getTime();
  const srStr=getSR(k);
  const tmrKey=getTomorrowKey();
  const tmrStr=getSR(tmrKey);
  const tmrDate=getTomorrowDateObj();
  const srMs=srStr ? timeToMs(srStr,n) : null;
  const tmrMs=tmrStr ? timeToMs(tmrStr,tmrDate) : null;
  const diffSr=srMs===null ? null : srMs-t;
  const MINUS10=-600000;
  const oneHrBeforeTmr=tmrMs===null ? null : tmrMs-3600000;
  const inClockMode=diffSr!==null && diffSr<MINUS10 && (!oneHrBeforeTmr || t<oneHrBeforeTmr);

  const currentEl=document.getElementById('currentTime');
  const inlineHanetzEl=document.getElementById('inlineHanetzTime');
  const cardCurrent=document.getElementById('cardCurrent');
  const cardsContainer=document.getElementById('cardsContainer');
  const colorBar=document.getElementById('colorBar');
  const clockEl=document.getElementById('clockMode');
  
  cardCurrent.style.display=inClockMode?'none':'';
  cardsContainer.style.display=inClockMode?'none':'';
  colorBar.style.display=inClockMode?'none':'';
  document.getElementById('inlineHanetz').style.display=inClockMode?'none':'';
  
  clockEl.classList.toggle('show',inClockMode);
  
  const timeFormatted = fmtClock(n);
  currentEl.textContent=timeFormatted;
  inlineHanetzEl.textContent = srStr || '--:--:--';

  if(inClockMode){
    lastTime=timeFormatted; drawSeg(lastTime);
    const heb=H[k] || 'תאריך עברי לא נמצא';
    const dd=String(n.getDate()).padStart(2,'0');
    const mm=String(n.getMonth()+1).padStart(2,'0');
    const yyyy=n.getFullYear();
    document.getElementById('clockDate').textContent='יום '+DAYS[n.getDay()]+' | '+dd+'/'+mm+'/'+yyyy+' — '+heb;
    const tomorrowEl=document.getElementById('clockTomorrow');
    tomorrowEl.textContent='';
    if(tmrMs!==null){
      const label=document.createElement('span');
      label.textContent=tmrStr;
      tomorrowEl.append('זריחה מחר: ',label,' | עוד ',fmt(tmrMs-t,false));
    } else {
      tomorrowEl.textContent='אין נתוני זריחה למחר';
    }
    return;
  }

  document.getElementById('hanetzTime').textContent=srStr || '--:--:--';
  const cdEl=document.getElementById('hanetzCd');
  cdEl.textContent=fmt(diffSr,true);
  cdEl.classList.toggle('minus',diffSr!==null && diffSr<0);
  document.getElementById('cardHanetz').classList.toggle('lit',diffSr!==null && diffSr<3600000 && diffSr>MINUS10);
}

updateDebugInputsFromCurrent();
tick();
setInterval(()=>{ updHeader(); tick(); }, 1000);

let wakeLock = null;
async function requestWakeLock() {
  if ('wakeLock' in navigator) {
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } catch (err) {}
  }
}
requestWakeLock();
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible') {
    await requestWakeLock();
  }
});

function goFS(){
  const e=document.documentElement;
  (e.requestFullscreen||e.webkitRequestFullscreen||e.mozRequestFullScreen||function(){}
  ).call(e);
}
document.addEventListener('click',goFS,{once:true});

let pt=null, tapC=0, tapT=null;
function toggleDbg(){
  const dbg = document.getElementById('dbg');
  if(!dbg.classList.contains('open')){
    updateDebugInputsFromCurrent();
    wireDbgButtons();
    dbg.classList.add('open');
  } else {
    dbg.classList.remove('open');
  }
}

async function resetAppCompletely(){
  if(!confirm('האם אתה בטוח שברצונך לאפס לחלוטין את האפליקציה ולנקות את כל הנתונים השמורים?')) return;
  localStorage.clear();
  try{
    if('serviceWorker' in navigator){
      const registrations=await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.map(r=>r.unregister()));
    }
    if('caches' in window){
      const names=await caches.keys();
      await Promise.all(names.map(name=>caches.delete(name)));
    }
  }catch(err){}
  alert('האפליקציה אופסה בהצלחה. הדפדפן יתרענן כעת.');
  location.reload();
}

  if(e.target.classList.contains('color-dot')||e.target.classList.contains('db')||e.target.closest('.version-badge')) return;
  pt = setTimeout(toggleDbg, 800);
}, {passive:true});
document.addEventListener('touchend', ()=>clearTimeout(pt), {passive:true});

document.addEventListener('mousedown', e=>{

});

document.addEventListener('click', e=>{

  tapC++; clearTimeout(tapT);
  tapT = setTimeout(()=>tapC=0, 600);
  if(tapC>=3){ tapC=0; toggleDbg(); }
});

function applyDebugTimeDate(){
  const dateVal = document.getElementById('dtDate').value.trim();
  const timeVal = document.getElementById('dtTime').value;
  
  const parts = dateVal.split('/');
  if(parts.length === 3){
    const d = parts[0].padStart(2,'0');
    const m = parts[1].padStart(2,'0');
    const y = parts[2];
    simulatedISODate = `${y}-${m}-${d}`;
  }
  
  if(!simulatedISODate || !timeVal) return;
  const simDate = new Date(simulatedISODate + 'T' + timeVal);
  customBaseTime = {
    simulated: simDate.getTime(),
    realWall: Date.now()
  };
  updHeader(); 
  tick();
  wireDbgButtons();
}

function sdTime(t){
  document.getElementById('dtTime').value = t;
  applyDebugTimeDate();
}

function resetDebug(){
  customBaseTime = null;
  simulatedISODate = null;
  updateDebugInputsFromCurrent();
  updHeader(); 
  tick();
  wireDbgButtons();
}

document.getElementById('dtDate').addEventListener('input', applyDebugTimeDate);
document.getElementById('dtTime').addEventListener('input', applyDebugTimeDate);
document.getElementById('dtDate').addEventListener('change', applyDebugTimeDate);
document.getElementById('dtTime').addEventListener('change', applyDebugTimeDate);

function exitFS(){
  (document.exitFullscreen||document.webkitExitFullscreen||document.mozCancelFullScreen||function(){}).call(document);
}

function wireDbgButtons(){
  const k = gk(now2());
  const sr = getSR(k);
  if(!sr) return;
  const [h,m,s] = sr.split(':').map(Number);
  const srSec = h*3600+m*60+s;
  function secToTime(sec){ return String(Math.floor(sec/3600)).padStart(2,'0')+':'+String(Math.floor((sec%3600)/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0'); }
  document.getElementById('btnHrBefore').onclick = ()=>sdTime(secToTime(srSec-3600));
  document.getElementById('btnSR').onclick        = ()=>sdTime(sr);
  document.getElementById('btnPlus5').onclick    = ()=>sdTime(secToTime(srSec+300));
  document.getElementById('btnPlus12').onclick   = ()=>sdTime(secToTime(srSec+720));
}
wireDbgButtons();
